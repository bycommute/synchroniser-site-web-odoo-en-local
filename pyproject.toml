[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-local-sync"
version = "0.1.0"
description = "Synchronize Odoo website content with local files, with safety rails for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ByCommute" }]
dependencies = [
  "python-dotenv>=1.0.0",
  "openpyxl>=3.1.0",
]

[project.scripts]
odoo-sync = "odoo_local_sync.cli:main"
odoo-local-sync = "odoo_local_sync.cli:main"

[tool.setuptools.packages.find]
include = ["odoo_local_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
